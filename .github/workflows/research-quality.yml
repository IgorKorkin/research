name: Research Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@main
        with:
          globs: |
            **/*.md

  links:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Use the official container image instead of fetching release tarballs.
      - name: Check links
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --workdir /workspace \
            lycheeverse/lychee:0.24.2 \
            --root-dir /workspace \
            --verbose \
            --no-progress \
            './**/*.md' './**/*.html' './**/*.rst'
